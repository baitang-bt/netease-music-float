<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'"
    />
    <title>设置</title>
    <link rel="stylesheet" href="./vendor/material-symbols/material-symbols.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <div class="settings-shell">
      <aside class="settings-sidebar" aria-label="设置">
        <header class="sidebar-brand">
          <strong>设置</strong>
        </header>
        <nav class="sidebar-nav">
          <button class="nav-item is-active" type="button">常规</button>
        </nav>
        <footer class="sidebar-footer">
          <button type="button" id="btn-quit" class="danger-button">退出</button>
        </footer>
      </aside>

      <main class="settings-main">
        <header class="panel-header">
          <h1>常规</h1>
        </header>

        <div class="card-grid">
          <article class="card">
            <h2 class="card-title">窗口</h2>
            <label class="setting-row">
              <span class="setting-text">
                <strong>始终置顶</strong>
              </span>
              <input id="always-on-top" type="checkbox" />
            </label>
          </article>

          <article class="card">
            <h2 class="card-title">更新</h2>
            <label class="setting-row">
              <span class="setting-text">
                <strong>启动时检查更新</strong>
              </span>
              <input id="auto-check-updates" type="checkbox" />
            </label>
            <p id="update-status" class="card-hint">—</p>
            <div class="permission-head">
              <button type="button" id="btn-check-update" class="secondary-button">
                <span class="material-symbols-outlined">system_update</span>
                检查更新
              </button>
              <button type="button" id="btn-install-update" class="primary-button" hidden>
                <span class="material-symbols-outlined">restart_alt</span>
                重启并安装
              </button>
            </div>
          </article>

          <article class="card">
            <h2 class="card-title">音乐软件</h2>
            <label class="setting-row setting-row-stack">
              <span class="setting-text">
                <strong>跟随播放器</strong>
              </span>
              <select id="target-player" class="setting-select"></select>
            </label>
            <button type="button" id="btn-open-player" class="secondary-button">
              <span class="material-symbols-outlined">open_in_new</span>
              <span id="open-player-label">打开所选音乐软件</span>
            </button>
          </article>

          <article class="card" id="playback-mode-card">
            <h2 class="card-title">播放模式</h2>
            <label class="setting-row setting-row-stack">
              <span class="setting-text">
                <strong>开机自动切换</strong>
              </span>
              <select id="launch-playback-mode" class="setting-select">
                <option value="keep">保持现状</option>
                <option value="sequential">顺序播放</option>
                <option value="all">列表循环</option>
                <option value="one">单曲循环</option>
                <option value="shuffle">随机播放</option>
              </select>
            </label>
            <button type="button" id="btn-accessibility" class="secondary-button">
              <span class="material-symbols-outlined">accessibility_new</span>
              授权辅助功能
            </button>
            <p id="accessibility-status" class="card-hint">检查中…</p>
          </article>

          <article class="card">
            <h2 class="card-title">外观</h2>
            <label class="setting-row">
              <span class="setting-text">
                <strong>透明小窗</strong>
              </span>
              <input id="transparent-float" type="checkbox" />
            </label>
            <label class="setting-row">
              <span class="setting-text">
                <strong>小窗颜色</strong>
              </span>
              <input id="window-color" type="color" value="#24242a" />
            </label>
            <label class="setting-row">
              <span class="setting-text">
                <strong>声浪颜色</strong>
              </span>
              <input id="spectrum-color" type="color" value="#e60026" />
            </label>
            <label class="setting-row setting-row-stack">
              <span class="setting-text">
                <strong>标题字体</strong>
              </span>
              <select id="title-font" class="setting-select"></select>
            </label>
            <label class="setting-row">
              <span class="setting-text">
                <strong>标题字号</strong>
                <small id="title-font-size-label">13px</small>
              </span>
              <input
                id="title-font-size"
                type="range"
                min="10"
                max="22"
                step="1"
                value="13"
              />
            </label>
            <p id="title-font-preview" class="font-preview">
              网易云 · NetEase · こんにちは
            </p>
            <button type="button" id="btn-reset-colors" class="secondary-button">
              恢复默认配色
            </button>
          </article>

          <article class="card" id="audio-capture-card">
            <h2 class="card-title">系统音频录制</h2>
            <div class="permission-head">
              <span class="setting-text">
                <strong>采集状态</strong>
                <small id="audio-status-detail">检查中…</small>
              </span>
              <span id="audio-status" class="status-chip">检查中</span>
            </div>
            <button type="button" id="btn-audio-permission" class="primary-button">
              <span class="material-symbols-outlined">shield_lock</span>
              请求录音权限
            </button>
          </article>
        </div>
      </main>
    </div>
    <script src="./theme-colors.js"></script>
    <script src="./title-fonts.js"></script>
    <script src="./settings.js"></script>
  </body>
</html>
